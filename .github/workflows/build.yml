name: Production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      VERCEL: "1"
      CRM_SHOWCASE_MODE: "true"
      DATABASE_URL: ""
      SESSION_SECRET: ""
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD_HASH: ""
      APP_URL: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.x"
          cache: npm
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Production build without a database or secrets
        run: npm run build
